steps:
  # Step 0: Configure Docker to authenticate with Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'gcloud auth configure-docker us-central1-docker.pkg.dev --quiet && echo "Docker auth configured."'

  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/supplychain-commander/supplychain-commander-repo/supplychain-commander-ai:latest'
      - '.'

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/supplychain-commander/supplychain-commander-repo/supplychain-commander-ai:latest'

images:
  - 'us-central1-docker.pkg.dev/supplychain-commander/supplychain-commander-repo/supplychain-commander-ai:latest'

options:
  logging: GCS_ONLY
